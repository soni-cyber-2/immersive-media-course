<!doctype html>
<html>

<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- 1. Position animation -->
        <a-sphere position="-2 1.5 -5" scale="0.5 0.5 0.5" color="gray" animation="
            property: position;
            to: -2 4 -5;
            dur: 2000;
            dir: alternate;
            loop: true">
        </a-sphere>


        <!-- 2. Rotation animation -->
        <a-box position="0 2 -5" color="blue" animation="
            property: rotation;
            to: 0 360 0;
            dur: 3000;
            loop: true;
            easing: linear">
        </a-box>


        <!-- 3. Scale animation -->
        <a-sphere position="2 2 -5" color="brown" scale="0.5 0.5 0.5" animation="
            property: scale;
            to: 1.5 1.5 1.5;
            dur: 1500;
            dir: alternate;
            loop: true">
        </a-sphere>


        <a-entity environment="preset: forest; dressingAmount: 500">
        </a-entity>

    </a-scene>

</body>

</html>
