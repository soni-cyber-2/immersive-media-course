<!doctype html>
<html>

<head>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
</head>

<body>
  <a-scene>
    <!-- Simple sphere -->
    <a-sphere position="0 2 -10" radius="2" color="red"> </a-sphere> 

    <!-- Environment without its own lighting -->
    <a-entity environment="
                preset: forest;
                dressingAmount: 500;
                lighting: none">
    </a-entity>

    <!-- Ambient light -->
    <a-light type="ambient" color="white" intensity="0.1"> </a-light>

    <!-- Point light -->
    <a-light type="point" color="white" intensity="10" position="-4 4 -7"></a-light>

  </a-scene>

</body>

</html>
