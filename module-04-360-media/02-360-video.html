
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My 360 VR Video</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        #videoControls {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 10;
        }

        #videoControls button {
            padding: 12px 20px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <!-- Video Controls -->
    <div id="videoControls">

        <button id="playButton">
            Play
        </button>

        <button id="pauseButton">
            Pause
        </button>

    </div>


    <!-- A-Frame Scene -->
    <a-scene>

        <!-- Video Assets -->
        <a-assets>

            <video
                id="video360"
                src="../assets/videos/360-video-123.mp4"
                loop
                playsinline
                webkit-playsinline
                preload="auto">
            </video>

        </a-assets>


        <!-- 360 Degree Video -->
        <a-videosphere
            src="#video360"
            rotation="0 -90 0">
        </a-videosphere>


        <!-- Camera -->
        <a-camera
            look-controls="
                touchEnabled: true;
                magicWindowTrackingEnabled: true">
        </a-camera>

    </a-scene>


    <!-- Video Interaction -->
    <script>

        // Get the video
        const video = document.querySelector('#video360');


        // Get buttons
        const playButton = document.querySelector('#playButton');

        const pauseButton = document.querySelector('#pauseButton');


        // Play video
        playButton.addEventListener('click', () => {

            video.play().catch(error => {
                console.error("Video playback error:", error);
            });

        });


        // Pause video
        pauseButton.addEventListener('click', () => {

            video.pause();

        });

    </script>

</body>

</html>
