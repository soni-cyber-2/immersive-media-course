<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>

        AFRAME.registerComponent('simple-hit-test', {

            init: function () {
                this.hitTestSource = null;
                this.refSpace = null;

                this.el.sceneEl.addEventListener('enter-vr', async () => {

                    const renderer = this.el.sceneEl.renderer;
                    const session = renderer.xr.getSession();

                    if (!session) return;

                    try {
                        const viewerSpace =
                            await session.requestReferenceSpace('viewer');

                        this.hitTestSource =
                            await session.requestHitTestSource({
                                space: viewerSpace
                            });

                        this.refSpace =
                            renderer.xr.getReferenceSpace();

                        console.log("Hit test ready");

                    } catch (error) {
                        console.error("Hit test setup failed:", error);
                    }
                });
            },

            tick: function () {

                if (!this.hitTestSource || !this.refSpace) return;

                const frame =
                    this.el.sceneEl.renderer.xr.getFrame();

                if (!frame) return;

                const results =
                    frame.getHitTestResults(this.hitTestSource);

                const marker =
                    document.querySelector('#marker');

                if (results.length > 0) {

                    const pose =
                        results[0].getPose(this.refSpace);

                    if (!pose) return;

                    marker.object3D.position.set(
                        pose.transform.position.x,
                        pose.transform.position.y,
                        pose.transform.position.z
                    );

                    marker.object3D.visible = true;

                } else {
                    marker.object3D.visible = false;
                }
            }
        });

    </script>

</head>


<body>

    <a-scene xr-mode-ui="XRMode: ar" webxr="optionalFeatures: hit-test;" simple-hit-test>

        <a-ring id="marker" radius-inner="0.025" radius-outer="0.04" rotation="-90 0 0" color="yellow" material="opacity: 0.7; transparent: true" visible="false">
        </a-ring>

    </a-scene>


    <script>

        const scene = document.querySelector('a-scene');

        function placeCube() {

            const marker = document.querySelector('#marker');

            if (!marker.object3D.visible) return;

            // Create a new cube
            const cube = document.createElement('a-box');

            cube.setAttribute('width', '0.2');
            cube.setAttribute('height', '0.2');
            cube.setAttribute('depth', '0.2');
            cube.setAttribute('color', 'tomato');

            // Copy marker position
            const position = marker.object3D.position;

            cube.setAttribute('position', {
                x: position.x,
                y: position.y + 0.1,
                z: position.z
            });

            // Add new cube to scene
            scene.appendChild(cube);
        }

        scene.addEventListener('enter-vr', () => {

            const session = scene.renderer.xr.getSession();

            if (session) {
                session.addEventListener('select', placeCube);
            }

        });

    </script>

</body>

</html>
