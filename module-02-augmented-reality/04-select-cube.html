<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        #overlay {
            display: none;
            font-family: Arial, sans-serif;
        }

        #overlay:xr-overlay {
            display: block;
        }

        #mode-bar {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        #actions {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            gap: 8px;
        }

        button {
            padding: 12px;
            font-size: 16px;
        }

        #crosshair {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: white;
        }
    </style>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>

        AFRAME.registerComponent('simple-hit-test', {

            init: function () {
                this.hitTestSource = null;
                this.refSpace = null;

                this.el.sceneEl.addEventListener('enter-vr', async () => {

                    const renderer = this.el.sceneEl.renderer;
                    const session = renderer.xr.getSession();

                    if (!session) return;

                    try {
                        const viewerSpace =
                            await session.requestReferenceSpace('viewer');

                        this.hitTestSource =
                            await session.requestHitTestSource({
                                space: viewerSpace
                            });

                        this.refSpace =
                            renderer.xr.getReferenceSpace();

                        console.log("Hit test ready");

                    } catch (error) {
                        console.error("Hit test setup failed:", error);
                    }
                });
            },

            tick: function () {

                if (!this.hitTestSource || !this.refSpace) return;

                const frame =
                    this.el.sceneEl.renderer.xr.getFrame();

                if (!frame) return;

                const results =
                    frame.getHitTestResults(this.hitTestSource);

                const marker =
                    document.querySelector('#marker');

                if (results.length > 0) {

                    const pose =
                        results[0].getPose(this.refSpace);

                    if (!pose) return;

                    marker.object3D.position.set(
                        pose.transform.position.x,
                        pose.transform.position.y,
                        pose.transform.position.z
                    );

                    marker.object3D.visible = true;

                } else {
                    marker.object3D.visible = false;
                }
            }
        });

    </script>

</head>


<body>

    <div id="overlay">

        <div id="mode-bar">
            <button id="add-button">ADD</button>
            <button id="select-button">SELECT</button>
            <span id="mode-text">Mode: ADD</span>
        </div>

        <div id="crosshair">+</div>

        <div id="actions">
            <button disabled>Color</button>
            <button disabled>Animate</button>
            <button disabled>Delete</button>
            <button disabled>Label</button>
        </div>

    </div>

    <a-scene xr-mode-ui="XRMode: ar" webxr="optionalFeatures: hit-test, dom-overlay;
           overlayElement: #overlay;" simple-hit-test>

        <a-ring id="marker" radius-inner="0.025" radius-outer="0.04" rotation="-90 0 0" color="yellow" visible="false">
        </a-ring>

        <a-camera id="camera" raycaster="objects: .selectable; far: 20">
        </a-camera>

    </a-scene>


    <script>

        const scene = document.querySelector('a-scene');

        let mode = 'add';
        let selectedCube = null;


        function placeCube() {

            const marker = document.querySelector('#marker');

            if (!marker.object3D.visible) return;

            const cube = document.createElement('a-box');

            cube.setAttribute('width', '0.2');
            cube.setAttribute('height', '0.2');
            cube.setAttribute('depth', '0.2');
            cube.setAttribute('color', 'tomato');

            // This makes the cube selectable
            cube.setAttribute('class', 'selectable');

            const position = marker.object3D.position;

            cube.setAttribute('position', {
                x: position.x,
                y: position.y + 0.1,
                z: position.z
            });

            scene.appendChild(cube);
        }


        function selectCube() {

            const camera = document.querySelector('#camera');

            const hits =
                camera.components.raycaster.intersectedEls;

            if (hits.length === 0) return;


            // Restore previous cube
            if (selectedCube) {
                selectedCube.setAttribute('color', 'tomato');
            }


            // Select new cube
            selectedCube = hits[0];

            selectedCube.setAttribute('color', 'yellow');

            document.querySelector('#actions').style.display = 'flex';
        }


        function setMode(newMode) {

            mode = newMode;

            document.querySelector('#mode-text').textContent =
                'Mode: ' + newMode.toUpperCase();

            document.querySelector('#crosshair').style.display =
                newMode === 'select' ? 'block' : 'none';
        }


        document.querySelector('#add-button').addEventListener(
            'click',
            () => setMode('add')
        );

        document.querySelector('#select-button').addEventListener(
            'click',
            () => setMode('select')
        );


        // Prevent UI button touches from triggering AR selection.
        document.querySelector('#overlay').addEventListener(
            'beforexrselect',
            (event) => event.preventDefault()
        );


        scene.addEventListener('enter-vr', () => {

            const session = scene.renderer.xr.getSession();

            session.addEventListener('select', () => {

                if (mode === 'add') {
                    placeCube();
                }

                if (mode === 'select') {
                    selectCube();
                }

            });

        });

    </script>

</body>

</html>
